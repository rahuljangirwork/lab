services:
  wg-easy:
    image: weejewel/wg-easy:latest
    container_name: wg-easy
    environment:
      # WG_HOST is the public-facing IP/domain of the VPN server.
      - WG_HOST=${WG_HOST}

      # The password for the wg-easy web UI.
      - PASSWORD=${PASSWORD}

      # This new line adds the NAT rule to fix local access issues.
      - WG_POST_UP=iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE

      # Optional: Default DNS server for clients.
      - WG_DEFAULT_DNS=1.1.1.1

      # Optional: The default client allowed IPs.
      - WG_ALLOWED_IPS=${WG_ALLOWED_IPS_DEFAULT}
    volumes:
      # This volume is crucial. It stores the WireGuard configuration files.
      - ./config:/etc/wireguard
    ports:
      # Port for the wg-easy web UI
      - "51821:51821/tcp"
      # Port for the WireGuard VPN connection itself
      - "51820:51820/udp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
