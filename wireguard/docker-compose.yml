services:
  wg-easy:
    image: weejewel/wg-easy:latest
    container_name: wg-easy
    # This is the fix: Use the host's network directly.
    network_mode: host
    environment:
      # WG_HOST is the public-facing IP/domain of the VPN server.
      - WG_HOST=${WG_HOST}

      # The password for the wg-easy web UI.
      - PASSWORD=${PASSWORD}

      # This NAT rule allows clients to access the LAN.
      - WG_POST_UP=iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -j MASQUERADE

      # Optional: Default DNS server for clients.
      - WG_DEFAULT_DNS=1.1.1.1

      # Optional: The default client allowed IPs.
      - WG_ALLOWED_IPS=${WG_ALLOWED_IPS_DEFAULT}
    volumes:
      # This volume is crucial. It stores the WireGuard configuration files.
      - ./config:/etc/wireguard
    # The 'ports' section is no longer needed with network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    # The sysctls block is removed as it's now handled by the host LXC.
